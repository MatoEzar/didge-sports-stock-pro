<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff | Didge Sports Stock Pro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>Didge Sports</h2>
      <p>Stock Pro</p>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" data-page="dashboard" class="nav-item"><span>📊</span> Dashboard</a>
      <a href="products.html" data-page="products" class="nav-item"><span>📦</span> Products</a>
      <a href="import.html" data-page="import" class="nav-item"><span>📥</span> Import</a>
      <a href="stock.html" data-page="stock" class="nav-item"><span>🔄</span> Stock</a>
      <a href="sales.html" data-page="sales" class="nav-item"><span>🛒</span> Sales</a>
      <a href="suppliers.html" data-page="suppliers" class="nav-item"><span>🚚</span> Suppliers</a>
      <a href="cash.html" data-page="cash" class="nav-item"><span>💰</span> Cash & Bank</a>
      <a href="expenses.html" data-page="expenses" class="nav-item"><span>📉</span> Expenses</a>
      <a href="staff.html" data-page="staff" class="nav-item active"><span>👤</span> Staff</a>
    </nav>
    <div class="sidebar-footer">
      <button id="logoutBtn" class="btn-logout">Logout</button>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle">☰</button>
      <div>
        <h1>Staff</h1>
        <p id="welcomeRole" style="font-size:13px; color:#666;"></p>
      </div>
      <div class="user-info"><span id="userEmail">Loading...</span></div>
    </header>

    <section class="page-content">
      <div class="actions-bar">
        <button class="btn-primary" id="addBtn">+ Add staff</button>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Search staff...">
        </div>
      </div>

      <div class="table-card">
        <table class="data-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="staffBody"></tbody>
        </table>
        <p id="noStaff" class="empty-state" style="display:none;">No staff yet.</p>
      </div>
    </section>
  </main>

  <div class="modal" id="staffModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Add staff</h2>
        <button class="close-btn" data-close="staffModal">&times;</button>
      </div>
      <form id="staffForm">
        <div class="form-group">
          <label>Full name *</label>
          <input type="text" id="staffName" required placeholder="e.g. Jane Wanjiku">
        </div>
        <div class="form-group">
          <label>Email *</label>
          <input type="email" id="staffEmail" required placeholder="name@email.com">
        </div>
        <div class="form-group">
          <label>Password *</label>
          <input type="password" id="staffPassword" required minlength="6" placeholder="At least 6 characters">
        </div>
        <div class="form-group">
          <label>Role *</label>
          <select id="staffRole" required>
            <option value="inventory">Inventory Manager</option>
            <option value="cashier">Cashier</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" data-close="staffModal">Cancel</button>
          <button type="submit" class="btn-primary" id="saveStaffBtn">Create account</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
    import {
      getAuth, createUserWithEmailAndPassword, signOut,
      setPersistence, inMemoryPersistence
    } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
    import {
      collection, getDocs, doc, setDoc, updateDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";
    import { auth, db, firebaseConfig } from "../js/firebase-config.js";
    import { guard } from "../js/roles.js";

    const ROLE_LABEL = {
      admin: "Admin",
      inventory: "Inventory Manager",
      cashier: "Cashier"
    };

    let currentUser = null;
    let staff = [];

    const session = await guard("staff");
    currentUser = session.user;

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "../index.html";
    });
    document.getElementById("menuToggle").addEventListener("click", () => {
      document.getElementById("sidebar").classList.toggle("open");
    });
    document.querySelectorAll("[data-close]").forEach((el) => {
      el.addEventListener("click", () => {
        document.getElementById(el.dataset.close).style.display = "none";
      });
    });

    async function refresh() {
      const snap = await getDocs(collection(db, "users"));
      staff = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      staff.sort((a, b) => (a.name || a.email || "").localeCompare(b.name || b.email || ""));
      render();
    }

    function render() {
      const term = document.getElementById("searchInput").value.toLowerCase();
      const list = staff.filter((person) =>
        (person.name || "").toLowerCase().includes(term) ||
        (person.email || "").toLowerCase().includes(term) ||
        (ROLE_LABEL[person.role] || person.role || "").toLowerCase().includes(term)
      );
      const body = document.getElementById("staffBody");
      body.innerHTML = "";
      document.getElementById("noStaff").style.display = list.length ? "none" : "block";

      list.forEach((person) => {
        const active = person.active !== false;
        const isMe = person.id === currentUser.uid;
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><strong>${person.name || "-"}</strong></td>
          <td>${person.email || "-"}</td>
          <td>${ROLE_LABEL[person.role] || person.role || "-"}</td>
          <td style="color:${active ? "#1e7a46" : "#c0392b"}; font-weight:600;">${active ? "Active" : "Disabled"}</td>
          <td>${isMe ? "You" : `<button class="btn-delete" data-id="${person.id}">${active ? "Disable" : "Enable"}</button>`}</td>`;
        body.appendChild(tr);
      });

      body.querySelectorAll("[data-id]").forEach((btn) => {
        btn.addEventListener("click", () => toggleStaff(btn.dataset.id));
      });
    }

    document.getElementById("searchInput").addEventListener("input", render);

    document.getElementById("addBtn").addEventListener("click", () => {
      document.getElementById("staffForm").reset();
      document.getElementById("staffRole").value = "inventory";
      document.getElementById("staffModal").style.display = "flex";
    });

    document.getElementById("staffForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("staffName").value.trim();
      const email = document.getElementById("staffEmail").value.trim();
      const password = document.getElementById("staffPassword").value;
      const role = document.getElementById("staffRole").value;
      const saveBtn = document.getElementById("saveStaffBtn");
      if (password.length < 6) return alert("Password must be at least 6 characters.");

      saveBtn.disabled = true;
      saveBtn.textContent = "Creating...";
      let secondaryApp = null;

      try {
        secondaryApp = initializeApp(firebaseConfig, "staffCreator-" + Date.now());
        const secondaryAuth = getAuth(secondaryApp);
        await setPersistence(secondaryAuth, inMemoryPersistence);
        const cred = await createUserWithEmailAndPassword(secondaryAuth, email, password);
        await setDoc(doc(db, "users", cred.user.uid), {
          name,
          email,
          role,
          active: true,
          createdAt: serverTimestamp(),
          createdBy: currentUser.email
        });
        await signOut(secondaryAuth);
        document.getElementById("staffModal").style.display = "none";
        await refresh();
        alert(name + " can now log in as " + (ROLE_LABEL[role] || role) + ".");
      } catch (error) {
        const known = {
          "auth/email-already-in-use": "That email already has an account.",
          "auth/invalid-email": "Enter a real email address.",
          "auth/weak-password": "Password must be at least 6 characters."
        };
        alert(known[error.code] || ("Could not create the account: " + error.message));
      } finally {
        if (secondaryApp) {
          try { await deleteApp(secondaryApp); } catch (err) { /* already closed */ }
        }
        saveBtn.disabled = false;
        saveBtn.textContent = "Create account";
      }
    });

    async function toggleStaff(id) {
      if (id === currentUser.uid) return alert("You cannot disable your own account.");
      const person = staff.find((p) => p.id === id);
      if (!person) return;
      const turningOff = person.active !== false;
      const label = person.name || person.email;
      const question = turningOff
        ? "Disable " + label + "? They will not be able to log in."
        : "Enable " + label + " again?";
      if (!confirm(question)) return;
      await updateDoc(doc(db, "users", id), { active: !turningOff });
      await refresh();
    }

    await refresh();
  </script>
</body>
</html>
