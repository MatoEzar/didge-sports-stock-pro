<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Didge Sports - Stock Pro | Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1>Didge Sports</h1>
        <p>Stock Management System</p>
      </div>

      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required autocomplete="off">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="new-password">
        </div>

        <button type="submit" class="btn-primary" id="loginBtn">Login</button>
        <p id="errorMessage" class="error-message"></p>
      </form>

      <div class="login-footer">
        <p>© 2026 Didge Sports. All rights reserved.</p>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth } from './js/firebase-config.js';
    import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

    // Always show login form (do not auto-redirect if already logged in)
    // We remove the automatic redirect so user must login every time

    const loginForm = document.getElementById('loginForm');
    const errorMessage = document.getElementById('errorMessage');
    const loginBtn = document.getElementById('loginBtn');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      loginBtn.disabled = true;
      loginBtn.textContent = "Logging in...";
      errorMessage.textContent = "";

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "pages/dashboard.html";
      } catch (error) {
        errorMessage.textContent = "Invalid email or password";
        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
      }
    });
  </script>

</body>
</html>
